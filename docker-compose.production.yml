
services:
  # ========================================
  # DATABASES
  # ========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: kolabri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolabri-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-strong-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kolabri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:4.4
    container_name: kolabri-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-your-mongo-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - kolabri-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kolabri-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-your-redis-password}
    volumes:
      - redis_data:/data
    networks:
      - kolabri-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # VECTOR DATABASE
  # ========================================
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kolabri-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - kolabri-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # APPLICATION SERVICES
  # ========================================
  
  ai-engine:
    build:
      context: ./Kolabri-ai-engine
      dockerfile: Dockerfile
    container_name: kolabri-ai-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./Kolabri-ai-engine/.env.production
    environment:
      - ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
      - DOCS_ENABLED=true
      - CORE_API_URL=https://kolabri.web.id/api
      - UNIFIED_PROVIDER_ENABLED=true
      - UNIFIED_PROVIDER_PERSONAL_CHAT=true
      - QDRANT_URL=http://qdrant:6333
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-your-mongo-password}@mongodb:27017/kolabri?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your-redis-password}
    depends_on:
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kolabri-network

  core-api:
    build:
      context: ./Kolabri-core-api
      dockerfile: Dockerfile
    container_name: kolabri-core-api
    restart: unless-stopped
    env_file:
      - ./Kolabri-core-api/.env.production
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development
      - DEBUG=*
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-your-strong-password}@postgres:5432/kolabri-db?schema=public&connection_limit=20&pool_timeout=20&connect_timeout=10
      - MONGODB_URL=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-your-mongo-password}@mongodb:27017/kolabri?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your-redis-password}@redis:6379
      - AI_ENGINE_URL=http://ai-engine:8001
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
    volumes:
      - ./Kolabri-client-app/storage/app/public:/shared-storage:rw
      - ./Kolabri-client-app/storage/app/private:/shared-storage-private:rw
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kolabri-network

  client-app:
    build:
      context: ./Kolabri-client-app
      dockerfile: Dockerfile
    container_name: kolabri-client-app
    restart: unless-stopped
    env_file:
      - ./Kolabri-client-app/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=kolabri-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-your-strong-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your-redis-password}
      - API_BASE_URL=http://core-api:3000
      - AI_ENGINE_URL=http://ai-engine:8001
    volumes:
      - ./Kolabri-client-app/storage/app/public:/var/www/html/storage/app/public:rw
      - ./Kolabri-client-app/storage/app/private:/var/www/html/storage/app/private:rw
      - ./Kolabri-client-app/storage/app/public:/shared-storage:rw
      - ./Kolabri-client-app/storage/app/private:/shared-storage-private:rw
    depends_on:
      - postgres
      - core-api
    networks:
      - kolabri-network

  # ========================================
  # REVERSE PROXY
  # ========================================
  
  nginx:
    profiles:
      - docker-nginx
    image: nginx:alpine
    container_name: kolabri-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - client-app
      - core-api
      - ai-engine
    networks:
      - kolabri-network

networks:
  kolabri-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  qdrant_storage:
  nginx_logs:
